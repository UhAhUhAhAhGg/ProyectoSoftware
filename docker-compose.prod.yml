version: '3.8'

services:
  # ===== BASES DE DATOS =====
  auth-db:
    image: postgres:15
    container_name: auth_db_prod
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - auth_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  profiles-db:
    image: postgres:15
    container_name: profiles_db_prod
    restart: always
    environment:
      POSTGRES_DB: profiles_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - profiles_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d profiles_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  events-db:
    image: postgres:15
    container_name: events_db_prod
    restart: always
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - events_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d events_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue-db:
    image: postgres:15
    container_name: queue_db_prod
    restart: always
    environment:
      POSTGRES_DB: queue_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - queue_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d queue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MICROSERVICIOS BACKEND =====
  service-auth:
    build: ./service-auth
    container_name: service_auth_prod
    restart: always
    environment:
      DB_NAME: auth_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: auth-db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: auth_config.settings
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP},https://${SERVER_IP}"
    depends_on:
      auth-db:
        condition: service_healthy
    command: >
      sh -c "pip install gunicorn &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn auth_config.wsgi:application --bind 0.0.0.0:8000"

  service-profiles:
    build: ./service-profiles
    container_name: service_profiles_prod
    restart: always
    environment:
      DB_NAME: profiles_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: profiles-db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: profiles_config.settings
      AUTH_SERVICE_URL: "http://service-auth:8000"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP},https://${SERVER_IP}"
    depends_on:
      profiles-db:
        condition: service_healthy
    command: >
      sh -c "pip install gunicorn &&
             python manage.py makemigrations profiles &&
             python manage.py migrate &&
             gunicorn profiles_config.wsgi:application --bind 0.0.0.0:8000"

  service-events:
    build: ./service-events
    container_name: service_events_prod
    restart: always
    environment:
      DB_NAME: events_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: events-db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: events_config.settings
      AUTH_SERVICE_URL: "http://service-auth:8000"
      QUEUE_SERVICE_URL: "http://service-queue:8000"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: "TicketProject <noreply@ticketproject.com>"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP},https://${SERVER_IP}"
    depends_on:
      events-db:
        condition: service_healthy
    command: >
      sh -c "pip install gunicorn &&
             python manage.py makemigrations events &&
             python manage.py migrate &&
             gunicorn events_config.wsgi:application --bind 0.0.0.0:8000"

  service-queue:
    build: ./service-queue
    container_name: service_queue_prod
    restart: always
    environment:
      DB_NAME: queue_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: queue-db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: queue_config.settings
      AUTH_SERVICE_URL: "http://service-auth:8000"
      EVENTS_SERVICE_URL: "http://service-events:8000"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://${SERVER_IP},https://${SERVER_IP}"
    depends_on:
      queue-db:
        condition: service_healthy
    command: >
      sh -c "pip install gunicorn &&
             python manage.py makemigrations queue_app &&
             python manage.py migrate &&
             gunicorn queue_config.wsgi:application --bind 0.0.0.0:8000"

  # ===== FRONTEND =====
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_AUTH_URL=http://${SERVER_IP}
        - NEXT_PUBLIC_PROFILES_URL=http://${SERVER_IP}
        - NEXT_PUBLIC_EVENTS_URL=http://${SERVER_IP}
        - NEXT_PUBLIC_QUEUE_URL=http://${SERVER_IP}
    container_name: frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_AUTH_URL: "http://${SERVER_IP}"
      NEXT_PUBLIC_PROFILES_URL: "http://${SERVER_IP}"
      NEXT_PUBLIC_EVENTS_URL: "http://${SERVER_IP}"
      NEXT_PUBLIC_QUEUE_URL: "http://${SERVER_IP}"
    depends_on:
      - service-auth
      - service-profiles
      - service-events
      - service-queue

  # ===== NGINX REVERSE PROXY =====
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - service-auth
      - service-profiles
      - service-events
      - service-queue

volumes:
  auth_data_prod:
  profiles_data_prod:
  events_data_prod:
  queue_data_prod:
